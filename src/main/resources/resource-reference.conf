# Main reference.conf must include this resource explicitly.
akka.actor.serializers {
  monarch-resource-protobuf = "net.imadz.monarch.persistence.resource.ResourceSerializer"
  monarch-resource-wire-protobuf = "net.imadz.monarch.persistence.resource.ResourceWireSerializer"
}
akka.actor.serialization-bindings {
  "net.imadz.monarch.persistence.resource.ResourceEvent" = monarch-resource-protobuf
  "net.imadz.monarch.persistence.resource.ResourceState" = monarch-resource-protobuf
  "net.imadz.monarch.persistence.resource.ResourceProtocol$Wire" = monarch-resource-wire-protobuf
}
monarch.resource {
  max-reservations = 10000
  max-queued = 1000
  limits {
    max-request-bytes = 65536
    max-state-bytes = 1048576
    max-result-bytes = 1048576
    max-evidence-bytes = 65536
    max-envelope-bytes = 4194304
    max-string-bytes = 4096
    max-plan-steps = 1024
    max-metadata-entries = 64
  }
}
# Pass ResourceSettings.fromConfig(system.settings.config) to the factory to use
# overrides. The initial definition freezes capacities AND these settings. A
# mismatch on recreation blocks all grants and writes, but Query returns Unknown.
# Serializer read ceilings are immutable ProtocolLimits() ceilings: changing host
# limits must reach the queryable mismatch check, not make old state unreadable.
# IDs/tombstones are retained for this domain's lifetime, without eviction/expiry.
# max-state-bytes also bounds aggregate snapshots, reserving release-receipt space.
# A full domain may reject new transfer destinations. No forced physical release,
# journal deletion, automatic retry, or cross-domain/brain-split fencing is supplied.
