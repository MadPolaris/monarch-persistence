# Included by the root reference.conf; kept separate from legacy Monarch bindings.
akka.actor.serializers {
  monarch-operation-protobuf = "net.imadz.monarch.persistence.operation.OperationSerializer"
  monarch-operation-wire-protobuf = "net.imadz.monarch.persistence.operation.OperationWireSerializer"
}
akka.actor.serialization-bindings {
  "net.imadz.monarch.persistence.operation.OperationEvent" = monarch-operation-protobuf
  "net.imadz.monarch.persistence.operation.OperationState" = monarch-operation-protobuf
  "net.imadz.monarch.persistence.operation.OperationProtocol$Wire" = monarch-operation-wire-protobuf
}

monarch.operation {
  io-timeout = 10s
  check-interval = 1s
  max-checks = 8
  manual-check-budget = 3
  max-reconciliations = 8
  max-submissions = 1
  limits {
    max-request-bytes = 65536
    max-state-bytes = 1048576
    max-result-bytes = 1048576
    max-evidence-bytes = 65536
    max-envelope-bytes = 4194304
    max-string-bytes = 4096
    max-plan-steps = 1024
    max-metadata-entries = 64
  }
}

# Pass OperationSettings.fromConfig(system.settings.config) for these overrides
# to affect actor policy; serializers always use these configured limits. Policy
# is frozen in Prepared. Aggregate event/state bytes use max-envelope-bytes;
# request/result/evidence bytes are individually bounded. max-state-bytes and
# plan/metadata counts retain the shared ProtocolLimits meaning (there is no
# separate opaque state payload, plan or metadata map in this operation model).
#
# Future timeout is not cancellation. The actor durably blocks and holds its
# one live-call slot until completion. Reconcile cannot start another call during
# that hold. Controlled recreation removes only the local hold; a timed-out
# Blocked operation then needs explicit Reconcile and still queries the same key.
# No Java serialization or whole-Command binding is introduced here.
