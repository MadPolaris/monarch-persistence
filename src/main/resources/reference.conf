include "operation-reference.conf"

akka.actor {
  serializers {
    monarch-proto = "net.imadz.monarch.persistence.MonarchSerializer"
    monarch-run-wire = "net.imadz.monarch.persistence.RunProtocolSerializer"
  }
  serialization-bindings {
    "net.imadz.monarch.persistence.RunProtocol$Wire" = monarch-run-wire
    "net.imadz.monarch.persistence.PersistentMonarch$Event" = monarch-proto
    "net.imadz.monarch.persistence.PersistentMonarch$DurableState" = monarch-proto
    "net.imadz.monarch.persistence.PersistentMonarch$RunState" = monarch-proto
  }
}

# Historical 0.2 records retain Jackson's serializer id and class manifest.
# Allow only the published event classes, not the whole application namespace.
akka.serialization.jackson.allowed-class-prefix += "net.imadz.monarch.persistence.PersistentMonarch$RunStarted"
akka.serialization.jackson.allowed-class-prefix += "net.imadz.monarch.persistence.PersistentMonarch$StageDone"
akka.serialization.jackson.allowed-class-prefix += "net.imadz.monarch.persistence.PersistentMonarch$RunCompleted"
akka.serialization.jackson.allowed-class-prefix += "net.imadz.monarch.persistence.PersistentMonarch$RunFailedEvt"
