# The host/root reference.conf explicitly includes this resource.
# No binding to Command: private callbacks are never remote protocol values.
akka.actor.allow-java-serialization = off
akka.actor.serializers {
  monarch-delivery-protobuf = "net.imadz.monarch.persistence.delivery.DeliverySerializer"
  monarch-delivery-wire-protobuf = "net.imadz.monarch.persistence.delivery.DeliveryWireSerializer"
}
akka.actor.serialization-bindings {
  "net.imadz.monarch.persistence.delivery.DeliveryEvent" = monarch-delivery-protobuf
  "net.imadz.monarch.persistence.delivery.DeliveryState" = monarch-delivery-protobuf
  "net.imadz.monarch.persistence.delivery.DeliveryProtocol$Wire" = monarch-delivery-wire-protobuf
}

monarch.delivery {
  query-timeout = 5s
  poll-interval = 1s
  max-polls = 100
  limits {
    max-request-bytes = 65536
    max-state-bytes = 1048576
    max-result-bytes = 1048576
    max-evidence-bytes = 65536
    max-envelope-bytes = 4194304
    max-string-bytes = 4096
    max-plan-steps = 1024
    max-metadata-entries = 64
  }
}

# Use DeliverySettings.fromConfig(system.settings.config) to apply overrides to
# actors; serializers always use these limits. Acceptance pins timeouts, budgets
# and limits. max-polls is per round, with at most three explicit Reconcile rounds
# over a delivery's lifetime. Each query/start attempt is committed and bounded,
# including interrupted recovery attempts. Reconcile always queries the original
# child first. NotStarted may only re-ensure that same frozen child submission.
#
# A timeout does not cancel a port Future or free its one outstanding-call slot.
# Entity cardinality and controlled recreation are host responsibilities; this
# module is not a global admission coordinator. Request payload, child initial
# state and terminal last-committed state are independently bounded, and their
# aggregate plus identity/framing must fit max-envelope-bytes. Nonterminal child
# snapshots and stage journals are never retained by the inbox.
