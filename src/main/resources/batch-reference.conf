# Include explicitly from the host configuration (or the root reference.conf).
akka.actor.serializers {
  monarch-batch-protobuf = "net.imadz.monarch.persistence.batch.BatchSerializer"
  monarch-batch-wire-protobuf = "net.imadz.monarch.persistence.batch.BatchWireSerializer"
}
akka.actor.serialization-bindings {
  "net.imadz.monarch.persistence.batch.BatchEvent" = monarch-batch-protobuf
  "net.imadz.monarch.persistence.batch.BatchState" = monarch-batch-protobuf
  "net.imadz.monarch.persistence.batch.BatchProtocol$Wire" = monarch-batch-wire-protobuf
}

# Schema-1 hard ceilings are enforced by BatchCodec in BOTH directions, not
# overridable configuration: 1000 records/job, 100 live items, 32 active batches,
# 32 areas/execution-map entries/transitions/carried claims, 64 resource entries,
# 4096 UTF-8 bytes/string, 4096 bytes/item or item result, 64 KiB resource proof.
# A record is at most 24 KiB. 1000 such history records need 23.4375 MiB;
# adding the 4 MiB live frontier and framing fits the 32 MiB state/event ceiling.
# There is no truncation or legacy over-limit fallback. ActiveBatch is persisted
# in full, including delivery, completion, carry, counters, deadlines and resume.
# Public manifest/completion bytes are at most 1 MiB (child Run state/result).
# Public envelopes are at most 4 MiB; Get.limit is 1..100 and Current has at
# most 100 item rows, even for a 1000-record job. BatchSettings/ProtocolLimits
# may narrow runtime capacities; every setting is pinned by definitionDigest.
# Only Wire is bound: Command, timers and local callbacks are never wire DTOs.
